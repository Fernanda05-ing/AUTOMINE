spring:
  datasource:
    url: jdbc:h2:mem:automine;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    # H2 en modo MySQL usa las migraciones de MySQL
    locations: classpath:db/migration/mysql
  jpa:
    hibernate:
      # H2 nombra LONGBLOB distinto que MySQL; el esquema lo aplica Flyway igual
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: clave-de-pruebas-automatizadas-automine-2026-segura
  bootstrap:
    admin-email: admin@automine.co
    admin-password: Automine2026*
    demo-data: false
