# AUTOMINE API. Toda la configuracion sensible llega por variables de entorno
# para que la misma imagen sirva en local y en el servidor.
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: automine-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/automine_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      # El esquema lo crea Flyway; Hibernate verifica que las entidades coincidan (MySQL).
      # En PostgreSQL/Supabase se usa JPA_DDL_AUTO=none (los tipos binarios se nombran distinto).
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Bogota
  flyway:
    enabled: true
    # Una carpeta por motor: db/migration/mysql (local) y db/migration/postgresql (Supabase)
    locations: classpath:db/migration/{vendor}
  jackson:
    time-zone: America/Bogota
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Para el puerto 465 use MAIL_SSL=true y MAIL_STARTTLS=false
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /AutomineApi/v3/api-docs
  swagger-ui:
    path: /AutomineApi/swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  # development | production. En production se exigen claves propias.
  env: ${APP_ENV:development}
  jwt:
    # Debe tener al menos 32 caracteres. En produccion SIEMPRE por variable de entorno.
    secret: ${JWT_SECRET:automine-clave-de-desarrollo-cambiar-en-produccion-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  google:
    # ID de cliente OAuth (tipo "Aplicacion web") de Google Cloud. Vacio = boton de Google oculto.
    client-id: ${GOOGLE_CLIENT_ID:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  # Remitente. Vacio = la misma cuenta MAIL_USERNAME (Gmail exige que coincidan).
  mail-from: ${MAIL_FROM:}
  company:
    name: ${COMPANY_NAME:AUTOMINE S.A.S.}
    nit: ${COMPANY_NIT:900.123.456-7}
    city: ${COMPANY_CITY:Medellin, Antioquia}
    signer-name: ${COMPANY_SIGNER_NAME:Direccion de Talento Humano}
    signer-title: ${COMPANY_SIGNER_TITLE:Jefe de Recursos Humanos}
  # Nomina electronica: datos para el XML con estructura DIAN (no se envia a la DIAN).
  dian:
    prefijo: ${DIAN_PREFIJO:NE}
    # 1 = produccion, 2 = pruebas. PIN e ID los entrega la DIAN al habilitar el software.
    ambiente: ${DIAN_AMBIENTE:2}
    software-id: ${DIAN_SOFTWARE_ID:}
    software-pin: ${DIAN_SOFTWARE_PIN:00000}
    # Codigos DANE del empleador (05 Antioquia, 05001 Medellin)
    departamento: ${DIAN_DEPARTAMENTO:05}
    municipio: ${DIAN_MUNICIPIO:05001}
    direccion: ${COMPANY_ADDRESS:Sin dirección}
  # Archivos (fotos, certificados): vacio = dentro de la base de datos.
  # Con Supabase: URL del proyecto y la llave service_role (secreta, solo en el servidor).
  storage:
    supabase-url: ${SUPABASE_URL:}
    supabase-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:automine}
  # Notificaciones push: ruta del JSON de la cuenta de servicio de Firebase. Vacio = desactivadas.
  push:
    credentials: ${FCM_CREDENTIALS:}
  bootstrap:
    # Si la base no tiene usuarios se crea este administrador al arrancar.
    admin-email: ${ADMIN_EMAIL:admin@automine.co}
    admin-password: ${ADMIN_PASSWORD:Automine2026*}
    # Carga empleados, nomina, inventario, etc. de ejemplo (solo si la base esta vacia).
    # Los usuarios de demostracion usan la misma contrasena del administrador.
    demo-data: ${DEMO_DATA:false}
