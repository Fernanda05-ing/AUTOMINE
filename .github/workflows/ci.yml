name: CI AUTOMINE

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-y-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automine-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automine-platform/web/package-lock.json
      - name: Pruebas de la API (H2)
        run: mvn -B -f backend/pom.xml test
      - name: Compilar la web
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Construir imagen Docker
        run: docker build -t automine .

  movil:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automine-platform/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
