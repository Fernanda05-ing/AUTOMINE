# Mantiene despierta la demostracion gratuita: Render apaga la API tras 15 minutos sin uso
# y Supabase pausa la base tras 7 dias sin actividad. Cada 10 minutos consulta /Health.
# Configure en GitHub > Settings > Secrets and variables > Actions > Variables:
#   AUTOMINE_URL = https://automine-api.onrender.com   (sin barra final)
name: Mantener activo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.AUTOMINE_URL != '' }}
    steps:
      - name: Consultar la API
        run: curl -fsS --max-time 90 "${{ vars.AUTOMINE_URL }}/AutomineApi/Health" || echo "La API esta despertando"
